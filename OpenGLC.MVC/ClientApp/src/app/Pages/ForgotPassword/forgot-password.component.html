<div class="registration-form">
    <form>
      <!-- <div class="form-icon">
          <span><i class="fa fa-user"></i></span>
      </div> -->
      <div class="form-group; text-center">
        <h3>Recupera tu contraseña. </h3>
        <h6>Ingresa nombre de usuario o tu correo</h6>
      </div>
      <br>
      <div class="form-group">
        <input type="text" class="form-control item" id="username" name="userName" [(ngModel)]="userNameOrEmail" placeholder="Usuario">
      </div>
 
      <div *ngIf="!processing && responseMessage.length == 0" class="form-group; text-center">
        <button type="button" class="btn btn-block create-account" (click)="sendPasswordRequest()">Recuperar contraseña</button>
      </div>
      <br>

      <div *ngIf="!processing && responseMessage.length > 0 " class="form-group; text-center">
        <h5 style="color: green;" id="responseMsg"><i class="fa fa-check"></i> {{responseMessage}}</h5>
      </div>
  
      <div *ngIf="processing" class="form-group; text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>
  
  
    </form>
  
  </div>
  
  <div>
    <h6 style="text-align: center;">
   
    </h6>
  </div>
