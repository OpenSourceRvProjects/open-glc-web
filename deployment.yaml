apiVersion: apps/v1
kind: Deployment
metadata:
  name: openglc-app
spec:
  selector:
    matchLabels:
      app: openglc-app
  template:
    metadata:
      labels:
        app: openglc-app
    spec:
      containers:
      - name: openglc-app
        image: openglc.azurecr.io/openglcweb:latest
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
         - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: openglc-app
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: openglc-app      
